<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오톡 공유하기</title>
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script>
        Kakao.init('d37d7115ee156306b614fd6fa26b73f1'); // 여기에 카카오 JavaScript 키 입력

        function sendKakaoMessage() {
            Kakao.Link.sendDefault({
                objectType: 'feed',
                content: {
                    title: '팀 데스티니로 초대합니다!',
                    description: '버튼을 눌러 초대장을 열어주세요!',
                    imageUrl: 'https://jaje0616.github.io/riid/images/testing.png', // 공유할 이미지
                    link: {
                        mobileWebUrl: 'linktr.ee/Destiny_offical',
                        webUrl: 'linktr.ee/Destiny_offical'
                    }
                },
                buttons: [
                    {
                        title: '초대장 열기',
                        link: {
                            mobileWebUrl: 'linktr.ee/Destiny_offical',
                            webUrl: 'linktr.ee/Destiny_offical'
                        }
                    }
                ]
            });
        }
    </script>
</head>
<body>
    <button onclick="sendKakaoMessage()">카카오톡 공유</button>
</body>
</html>
